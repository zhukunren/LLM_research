<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观察池操作面板</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f6f8fc; --card: #fff; --ink: #172841; --muted: #536680;
  --line: #dce4ef; --focus: #325eba; --watch: #208475;
  --priority: #466dce; --ended: #8290a9;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #182234; --card: #202c40; --ink: #eef3fc;
    --muted: #aabbd4; --line: #3a485f; --focus: #8bb2ff; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
main { padding: 16px; }
h1 { margin: 0; font-size: 19px; }
header p { margin: 4px 0 0; }
header p, #scope, thead { color: var(--muted); }
.filters { display: grid; grid-template-columns: 1fr minmax(112px, 32%); gap: 9px; margin: 12px 0; }
input, select, button { color: inherit; font: inherit; }
input, select {
  width: 100%; min-width: 0; padding: 7px 8px; background: var(--card);
  border: 1px solid var(--line); border-radius: 6px;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.summary {
  display: grid; align-items: center; grid-template-columns: 84px 1fr;
  gap: 16px; margin-bottom: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 9px; padding: 12px;
}
#ring { width: 80px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
#shown {
  width: 56px; aspect-ratio: 1; background: var(--card); border-radius: 50%;
  display: grid; place-items: center; font-size: 20px; font-weight: 650;
}
#split { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0; }
#split button {
  border: 1px solid var(--line); border-radius: 5px; background: var(--card);
  cursor: pointer; padding: 3px 6px;
}
#split button[aria-pressed="true"] { border-color: var(--focus); }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; }
table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--card); }
th, td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
th:nth-child(1) { width: 30%; }
th:nth-child(2) { width: 26%; }
.code { display: block; color: var(--muted); font-size: 12px; }
#empty { padding: 12px 8px; text-align: center; color: var(--muted); }
@media (max-width: 390px) {
  main { padding: 10px; }
  th:nth-child(2) { width: 32%; }
  .summary { gap: 10px; }
}
</style>
<main>
  <header><h1>观察池操作面板</h1><p>状态和备注可在本条消息里编辑。</p></header>
  <section class="filters" aria-label="筛选条件">
    <input id="search" type="search" aria-label="搜索股票" placeholder="搜索股票名称或代码">
    <select id="filter" aria-label="筛选观察状态"><option value="">全部状态</option></select>
  </section>
  <section class="summary" aria-label="观察状态分布">
    <div id="ring" aria-hidden="true"><span id="shown">0</span></div>
    <div><strong>观察状态分布</strong><div id="split"></div><div id="scope" role="status"></div></div>
  </section>
  <table aria-label="观察池记录">
    <thead><tr><th>股票</th><th>状态</th><th>备注草稿</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty" hidden></p>
</main>
<script type="application/json" id="panel-data">{"rows":[],"total":0}</script>
<script>
const dataset = JSON.parse(document.getElementById('panel-data').textContent);
const states = {watching:['关注中','--watch'], priority:['重点关注','--priority'], ended:['已结束','--ended']};
const records = dataset.rows.map(row => ({...row, originalStatus:row.status, originalNote:row.note}));
const search = document.getElementById('search');
const filter = document.getElementById('filter');
const chart = document.getElementById('split');
const rows = document.getElementById('rows');
const empty = document.getElementById('empty');
const legend = {};
for (const [status, [label, color]] of Object.entries(states)) {
  filter.add(new Option(label, status));
  const button = document.createElement('button');
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = 'var(' + color + ')';
  const text = document.createTextNode('');
  button.append(dot, text);
  button.addEventListener('click', () => { filter.value = filter.value === status ? '' : status; render(); });
  legend[status] = {button, text};
  chart.append(button);
}
function updateSummary(shown) {
  const edits = records.filter(row => row.status !== row.originalStatus || row.note !== row.originalNote).length;
  document.getElementById('scope').textContent =
    '已载入 ' + records.length + '/' + dataset.total + ' 条 · 显示 ' + shown.length + ' 条 · 草稿 ' + edits + ' 条';
}
function updateChart(shown) {
  const tally = {watching:0, priority:0, ended:0};
  for (const row of shown) tally[row.status]++;
  let offset = 0;
  const arcs = Object.entries(states).map(([status, [label, color]]) => {
    const start = offset;
    offset += shown.length ? (100 * tally[status]) / shown.length : 0;
    legend[status].text.textContent = label + ' ' + tally[status];
    legend[status].button.setAttribute('aria-pressed', String(filter.value === status));
    return 'var(' + color + ') ' + start + '% ' + offset + '%';
  });
  document.getElementById('ring').style.background = shown.length ? 'conic-gradient(' + arcs.join(',') + ')' : 'var(--line)';
  document.getElementById('shown').textContent = shown.length;
}
function render() {
  const query = search.value.trim().toLowerCase();
  const shown = records.filter(row => (!filter.value || row.status === filter.value) &&
    (row.stock_code + ' ' + row.name).toLowerCase().includes(query));
  const fragment = document.createDocumentFragment();
  for (const row of shown) {
    const tr = document.createElement('tr');
    const identity = tr.insertCell();
    const code = document.createElement('span');
    code.className = 'code';
    code.textContent = row.stock_code;
    identity.append(row.name || row.stock_code, code);
    const status = document.createElement('select');
    status.setAttribute('aria-label', row.stock_code + ' 状态');
    for (const [value, [label]] of Object.entries(states)) status.add(new Option(label, value));
    status.value = row.status;
    status.addEventListener('change', () => { row.status = status.value; render(); });
    tr.insertCell().append(status);
    const note = document.createElement('input');
    note.value = row.note;
    note.placeholder = '添加备注';
    note.maxLength = 2000;
    note.setAttribute('aria-label', row.stock_code + ' 备注');
    note.addEventListener('input', () => { row.note = note.value; updateSummary(shown); });
    tr.insertCell().append(note);
    fragment.append(tr);
  }
  rows.replaceChildren(fragment);
  empty.hidden = shown.length > 0;
  empty.textContent = records.length ? '当前筛选没有匹配记录。' : '当前观察池没有记录。';
  updateChart(shown);
  updateSummary(shown);
}
search.addEventListener('input', render);
filter.addEventListener('change', render);
render();
</script>
</html>
