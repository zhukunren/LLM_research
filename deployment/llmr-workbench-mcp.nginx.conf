location = /mcp {
    auth_basic "LLM Research MCP";
    auth_basic_user_file /etc/nginx/llmr-workbench-mcp.htpasswd;
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:18861;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:18861;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
}
