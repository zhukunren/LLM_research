location = /_workbench/browser/link {
    auth_basic "LLM Workbench Browser Link";
    auth_basic_user_file /etc/nginx/llmr-workbench-browser.htpasswd;
    client_max_body_size 4k;
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/link;
}

location @llmr_browser_sign_in {
    auth_basic off;
    auth_request off;
    if ($request_method !~ "^(GET|HEAD)$") { return 401; }
    if ($http_accept !~* "text/html") { return 401; }
    rewrite ^ /login? break;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock;
}

location = /_workbench/browser/login {
    auth_basic off;
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/login;
}

location = /_workbench/browser/login.js {
    auth_basic off;
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/login.js;
}

location = /_workbench/browser/login.css {
    auth_basic off;
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/login.css;
}

location = /_workbench/browser/password {
    auth_basic "LLM Research";
    auth_basic_user_file /etc/nginx/llmr.htpasswd;
    error_page 401 =403 /_workbench/browser/login-denied;
    client_max_body_size 4k;
    proxy_set_header Authorization "";
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/password;
}

location = /_workbench/browser/login-denied {
    internal;
    auth_basic off;
    add_header Cache-Control "no-store" always;
    return 403;
}

location = /_workbench/browser/session {
    auth_basic off;
    client_max_body_size 4k;
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/session;
}

location = /_workbench/browser/check {
    internal;
    auth_basic off;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_pass http://unix:/run/llmr-workbench-browser/browser.sock:/check;
}
