# The message sandbox loads the same compiled UI as the workbench. Only these static assets are public.
location ~ "^/_workbench/panels/(?<panel_digest>[0-9a-f]{16})/(?<panel_asset>workbench-panel\.(?:js|css))$" {
    auth_basic off;
    auth_request off;
    alias /opt/llmr-workbench-panels/$panel_digest/$panel_asset;
    disable_symlinks on from=/opt/llmr-workbench-panels;
    types { application/javascript js; text/css css; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
