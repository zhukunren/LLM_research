; Copy to config.ini only when creating a new configuration.
; Existing config.ini is read as-is and must not be committed.
[app]
model_provider = OpenAI
model = your-model-id
reasoning_effort = high

[research]
; Research can read sources, run Python/headless Playwright and create files in its own workspace.
; The research workspace has network access. Tushare credentials stay behind the MCP tool.
; Default mode for new conversations: research, screening, or advanced.
mode = research
turn_timeout_seconds = 1200
; 0 removes the fixed call-count cap; the elapsed-time budget still applies.
max_tool_calls = 0
max_output_file_bytes = 52428800

[model_providers.OpenAI]
base_url = https://api.openai.com
wire_api = responses
api_path = /v1/responses

[secrets]
; Prefer an environment variable; never commit a real API key.
openai_api_key_env = OPENAI_API_KEY

[tushare]
; The bundled tushare_relay.py may provide a local default. Prefer an
; environment variable when overriding it; never commit a real relay key.
relay_api_key_env = TUSHARE_RELAY_API_KEY
relay_base_url =
timeout = 30
retries = 3
