; Copy to config.ini only when creating a new configuration.
; Existing config.ini is read as-is and must not be committed.
[app]
model_provider = OpenAI
model = gpt-6-luna
; Base effort for independent model services; Codex turns use standard=high, deep=max.
reasoning_effort = high

[research]
; Research can read sources, run Python/headless Playwright and create files in its own workspace.
; The research workspace has network access. Tushare credentials stay behind the MCP tool.
; Default mode for new conversations: research, screening, or advanced.
mode = research
; Native Codex search: live for current research, cached for indexed results, or disabled.
web_search = live
; Standard research: 1 hour per turn; deep research allows at least 2 hours.
turn_timeout_seconds = 3600
; Allow slow reasoning and complete output; connection probes use their own short timeout.
model_request_timeout_seconds = 600
tool_timeout_seconds = 1800
; 0 removes the fixed call-count cap; the elapsed-time budget still applies.
max_tool_calls = 0
max_output_file_bytes = 52428800

[model_providers.OpenAI]
base_url = https://api.openai.com
wire_api = responses
api_path = /v1/responses
; Opt in only for a provider with a compatible standalone-search endpoint.
; Verify a real search and page open when changing the model provider.
supports_standalone_web_search = true

[secrets]
; Prefer an environment variable; never commit a real API key.
openai_api_key_env = OPENAI_API_KEY

[tushare]
; The bundled tushare_relay.py may provide a local default. Prefer an
; environment variable when overriding it; never commit a real relay key.
relay_api_key_env = TUSHARE_RELAY_API_KEY
relay_base_url =
timeout = 30
retries = 3

[reports]
; Default local PDF layout extraction. Docling is an optional offline backend.
parser = pypdf
; Required only for parser=docling: pre-provisioned local layout/table/OCR models.
docling_artifacts_path =
